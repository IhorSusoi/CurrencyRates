<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#008f72"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="#00d4aa" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Coin outer -->
  <circle cx="100" cy="100" r="82" fill="url(#coinGrad)" filter="url(#shadow)"/>

  <!-- Coin inner ring -->
  <circle cx="100" cy="100" r="72" fill="none"
          stroke="#ffffff" stroke-width="3" opacity="0.15"/>

  <!-- Shine overlay -->
  <circle cx="100" cy="100" r="82" fill="url(#shineGrad)"/>

  <!-- Dollar sign -->
  <text x="100" y="125" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="96" font-weight="bold"
        fill="#ffffff" opacity="0.95">$</text>

</svg>
